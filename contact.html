<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikdraft</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================================================
       1. HEADER & LOGO
       ========================================================================== -->
    <header class="site-header">
    <div class="site-brand">
        <img id="logo" src="Mikdraft_logo.png" alt="Mikdraft Logo">
        <h1>Mikdraft</h1>
    </div>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav> 
</header>


    <!-- ==========================================================================
       2. MAIN CONTENT & CONTACT FORM
       ========================================================================== -->
    <main>
        <h2>Contact Us</h2>
        
        <!-- ========================= This part shows the form ========================== -->
        <form action="#" method="POST" class="form">
            <fieldset>
                <legend>Your details</legend>

                <!-- 1. Name: Required text input -->
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <!-- 2. Email: Required email input -->
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- 3. Subject: Select dropdown with 4 options -->
                <div>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Select an option</option>
                        <option value="product-question">Product question</option>
                        <option value="order-status">Order status</option>
                        <option value="wholesale-enquiry">Wholesale enquiry</option>
                        <option value="something-else">Something else</option>
                    </select>
                </div>

                <!-- 4. Message: Required textarea -->
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <!-- Submit button with action-oriented text -->
                <div>
                    <button type="submit">Send message</button>
                </div>

            </fieldset>
        </form>

        <!-- Main Links -->
        <ul>
            <li><a href="https://hespedilla-dev.github.io/mikdraft/">Mikdraft</a></li>
        </ul>


        <!-- ==========================================================================
           3. FOOTER
           ========================================================================== -->
        <footer>
            <p>Contact Information:</p>
            <p>Email: <a href="mailto:hannakim.espedilla@tup.edu.ph">hannakim.espedilla@tup.edu.ph</a></p>
            <p>Phone: <a href="tel:+639123456789">+63 949 910 5002</a></p>
            <p>facebook: <a href="https://www.facebook.com/hannaespedilla">Hanna Kim Espedilla</a></p>
            <p>&copy; 2026 Mikdraft. All rights reserved.</p>
        </footer>
    </main>

</body>
</html>
